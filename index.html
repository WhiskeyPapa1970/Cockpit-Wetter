<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cockpit Weather</title>

<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#1c1c1c;
    border-bottom:2px solid #444;
}

h1{
    margin:0;
}

.panel{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.gauge{
    width:180px;
    height:180px;
    border-radius:50%;
    border:8px solid #666;
    background:radial-gradient(circle,#333,#000);
    margin:15px;
    position:relative;
}

.title{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.value{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:20px;
}

.needle{
    position:absolute;
    width:4px;
    height:60px;
    background:red;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.center{
    width:14px;
    height:14px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.warning{
    margin:20px;
    text-align:center;
    padding:15px;
    border-radius:10px;
    background:#006400;
}

</style>
</head>

<body>

<header>
<h1>✈️ Cockpit Weather</h1>
<p>Standard: Schwechat</p>
</header>

<div class="panel">

<div class="gauge">
<div class="title">Temperatur</div>
<div class="needle" style="transform:translateX(-50%) rotate(20deg);"></div>
<div class="center"></div>
<div class="value">-- °C</div>
</div>

<div class="gauge">
<div class="title">Luftdruck</div>
<div class="needle" style="transform:translateX(-50%) rotate(50deg);"></div>
<div class="center"></div>
<div class="value">---- hPa</div>
</div>

<div class="gauge">
<div class="title">Wind</div>
<div class="needle" style="transform:translateX(-50%) rotate(80deg);"></div>
<div class="center"></div>
<div class="value">-- km/h</div>
</div>

<div class="gauge">
<div class="title">Richtung</div>
<div class="needle" style="transform:translateX(-50%) rotate(135deg);"></div>
<div class="center"></div>
<div class="value">---°</div>
</div>

<div class="gauge">
<div class="title">Tendenz</div>
<div class="needle" style="transform:translateX(-50%) rotate(0deg);"></div>
<div class="center"></div>
<div class="value">0.0</div>
</div>

</div>

<div class="warning">
Wetterlage wird geladen...
</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
